<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Mobile / iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#090806" />

    <!-- iPhone Home Screen / Standalone App -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="KoTrack"
    />

    <!-- iOS Home Screen Icon -->
    <link
      rel="apple-touch-icon"
      href="/pwa-192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <!-- Page Title -->
    <title>KoTrack</title>

    <!-- Website Description -->
    <meta
      name="description"
      content="KoTrack makes shared drink expenses simple. Track sessions, balances and payments from one place."
    />

    <!-- Open Graph / WhatsApp / Facebook / Discord -->
    <meta
      property="og:title"
      content="KoTrack"
    />

    <meta
      property="og:description"
      content="Track shared drink expenses, sessions, balances and payments with KoTrack."
    />

    <meta
      property="og:url"
      content="https://kotrack.smolelab.com"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://kotrack.smolelab.com/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="KoTrack"
    />

    <meta
      name="twitter:description"
      content="Track shared drink expenses, sessions, balances and payments with KoTrack."
    />

    <meta
      name="twitter:image"
      content="https://kotrack.smolelab.com/og-image.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
