server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The production frontend defaults to same-origin /api requests. Route
    # those to the backend Service in the same Kubernetes namespace while
    # leaving client-side SPA routes on the fallback below.
    location ^~ /api/ {
        proxy_pass http://kotrack-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
