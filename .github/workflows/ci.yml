name: KoTrack CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:
    inputs:
      production_change_approved:
        description: "Request the production migration and deployment path"
        required: true
        type: boolean
        default: false
      backup_restore_test_id:
        description: "Reference to independently verified backup/restore evidence. The value itself is not proof; a production reviewer must inspect the evidence."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kotrack-ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel an in-flight run that may be performing a bounded migration.
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend lint, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drink_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drink_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create temporary JWT signing key
        shell: bash
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate migration chain
        run: alembic heads

      - name: Apply migrations to disposable database
        run: alembic upgrade head

      - name: Verify model and database schema are in sync
        run: alembic check

      - name: Run backend tests
        run: pytest -q

      - name: Audit Python dependencies
        if: always()
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  secret-and-static-analysis:
    name: Secret and Python static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Bandit scanner
        run: python -m pip install bandit
      - name: Scan backend source
        working-directory: backend
        run: bandit -r app -ll

  container-scan:
    name: Build and scan container images without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: kotrack-backend:${{ github.sha }}
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kotrack-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Build frontend image locally
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: kotrack-frontend:${{ github.sha }}
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: kotrack-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
