name: KoTrack CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "ci/**"]

permissions:
  contents: read

concurrency:
  group: kotrack-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, build, and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drink_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drink_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create temporary JWT signing key
        shell: bash
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate migration chain
        run: alembic heads

      - name: Apply migrations to disposable database
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest -q

      - name: Audit Python dependencies
        if: always()
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  publish-images:
    name: Build and publish KoTrack images to Harbor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: public-registry.smolelab.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            public-registry.smolelab.com/og/kotrack-frontend:${{ github.sha }}
            public-registry.smolelab.com/og/kotrack-frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            public-registry.smolelab.com/og/kotrack-backend:${{ github.sha }}
            public-registry.smolelab.com/og/kotrack-backend:latest

  deploy-production:
    name: Deploy KoTrack to Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Rancher connection
        shell: bash
        env:
          RANCHER_ACCESS_KEY: ${{ secrets.RANCHER_ACCESS_KEY }}
          RANCHER_SECRET_KEY: ${{ secrets.RANCHER_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$RANCHER_ACCESS_KEY" || -z "$RANCHER_SECRET_KEY" ]]; then
            echo "Rancher credentials are missing."
            exit 1
          fi

          kubectl config set-cluster rancher \
            --server=https://rancher.smolelab.com/k8s/clusters/local

          kubectl config set-credentials github-actions \
            --token="${RANCHER_ACCESS_KEY}:${RANCHER_SECRET_KEY}"

          kubectl config set-context kotrack-production \
            --cluster=rancher \
            --user=github-actions \
            --namespace=app

          kubectl config use-context kotrack-production

      - name: Check deployment permissions
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(kubectl auth can-i get deployments -n app)" != "yes" ]]; then
            echo "Missing permission to read deployments in namespace app."
            exit 1
          fi

          if [[ "$(kubectl auth can-i patch deployments -n app)" != "yes" ]]; then
            echo "Missing permission to patch deployments in namespace app."
            exit 1
          fi

      - name: Verify target deployments
        shell: bash
        run: |
          set -euo pipefail

          kubectl get deployment kotrack-backend -n app
          kubectl get deployment kotrack-frontend -n app

      - name: Deploy backend image
        shell: bash
        run: |
          set -euo pipefail

          kubectl set image deployment/kotrack-backend \
            kotrack-backend="public-registry.smolelab.com/og/kotrack-backend:${GITHUB_SHA}" \
            -n app

          kubectl rollout status deployment/kotrack-backend \
            -n app --timeout=180s

      - name: Deploy frontend image
        shell: bash
        run: |
          set -euo pipefail

          kubectl set image deployment/kotrack-frontend \
            kotrack-frontend="public-registry.smolelab.com/og/kotrack-frontend:${GITHUB_SHA}" \
            -n app

          kubectl rollout status deployment/kotrack-frontend \
            -n app --timeout=180s

      - name: Verify final deployment state
        shell: bash
        run: |
          set -euo pipefail

          kubectl get deployment kotrack-backend kotrack-frontend -n app
