          test -n "$RANCHER_ACCESS_KEY"
          test -n "$RANCHER_SECRET_KEY"

          kubectl config set-cluster rancher \
            --server=https://rancher.smolelab.com/k8s/clusters/local

          kubectl config set-credentials github-actions \
            --token="${RANCHER_ACCESS_KEY}:${RANCHER_SECRET_KEY}"

          kubectl config set-context kotrack-production \
            --cluster=rancher \
            --user=github-actions \
            --namespace=app

          kubectl config use-context kotrack-production

      - name: Check existing deployments and permissions
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment kotrack-backend kotrack-frontend -n app
          kubectl auth can-i patch deployments -n app | grep -qx yes

      - name: Save previous images for recovery
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          backend_image="$(kubectl get deployment kotrack-backend -n app \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="kotrack-backend")].image}')"

          frontend_image="$(kubectl get deployment kotrack-frontend -n app \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="kotrack-frontend")].image}')"

          if [[ -z "$backend_image" || -z "$frontend_image" ]]; then
            echo "::error::Could not retrieve both current production image references."
            echo "Backend image: ${backend_image:-EMPTY}"
            echo "Frontend image: ${frontend_image:-EMPTY}"
            exit 1
          fi

          echo "Previous backend image: $backend_image"
          echo "Previous frontend image: $frontend_image"
          echo "backend=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        env:
          DIGEST: ${{ needs.publish-images.outputs.backend_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          kubectl set image deployment/kotrack-backend \
            "kotrack-backend=public-registry.smolelab.com/og/kotrack-backend@${DIGEST}" \
            -n app

          kubectl rollout status deployment/kotrack-backend \
            -n app --timeout=180s

      - name: Deploy frontend
        env:
          DIGEST: ${{ needs.publish-images.outputs.frontend_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          kubectl set image deployment/kotrack-frontend \
            "kotrack-frontend=public-registry.smolelab.com/og/kotrack-frontend@${DIGEST}" \
            -n app

          kubectl rollout status deployment/kotrack-frontend \
            -n app --timeout=180s

      - name: Health checks
        shell: bash
        run: |
          set -euo pipefail

          kubectl exec deployment/kotrack-backend -n app -- \
            python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=10); assert r.status == 200"

          kubectl exec deployment/kotrack-frontend -n app -c kotrack-frontend -- \
            wget -qO- http://127.0.0.1/ >/dev/null

          kubectl exec deployment/kotrack-frontend -n app -c kotrack-frontend -- \
            wget -qO- http://127.0.0.1/api/health >/dev/null

          kubectl get deployment kotrack-backend kotrack-frontend -n app
          kubectl get pods -n app

      - name: Restore previous application images if deployment fails
        if: ${{ failure() && steps.previous.outputs.backend != '' && steps.previous.outputs.frontend != '' }}
        env:
          BACKEND_IMAGE: ${{ steps.previous.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.previous.outputs.frontend }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment failed. Restoring previous application images."

          kubectl set image deployment/kotrack-backend \
            "kotrack-backend=$BACKEND_IMAGE" -n app

          kubectl set image deployment/kotrack-frontend \
            "kotrack-frontend=$FRONTEND_IMAGE" -n app

          kubectl rollout status deployment/kotrack-backend \
            -n app --timeout=180s

          kubectl rollout status deployment/kotrack-frontend \
            -n app --timeout=180s
