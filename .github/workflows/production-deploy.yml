name: KoTrack Production Deployment

on:
  workflow_dispatch:
    inputs:
      production_change_approved:
        description: "Approve production deployment and migration"
        required: true
        type: boolean
        default: false
      backup_restore_test_id:
        description: "Backup/restore evidence ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kotrack-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    name: Backend tests and migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: drink_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d drink_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/drink_tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set temporary JWT key
        run: echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"

      - run: python -m pip install -r requirements.txt
      - run: alembic heads
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  secret-check:
    name: Secret and source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan backend
        working-directory: backend
        run: bandit -r app -ll

  production-preflight:
    name: Production approval and configuration gate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Validate dispatch inputs and production configuration
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          APPROVED: ${{ inputs.production_change_approved }}
          BACKUP_EVIDENCE_ID: ${{ inputs.backup_restore_test_id }}
          DEPLOYMENT_ENABLED: ${{ vars.PRODUCTION_DEPLOYMENT_ENABLED }}
        run: |
          set -euo pipefail

          echo "Event: ${EVENT_NAME}"
          echo "Ref: ${REF}"
          echo "Production approval selected: ${APPROVED}"

          if [[ -n "${BACKUP_EVIDENCE_ID:-}" ]]; then
            echo "Backup/restore evidence ID supplied: yes"
          else
            echo "::error::Backup/restore evidence ID is empty."
            exit 1
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Workflow must be manually dispatched."
            exit 1
          fi

          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Workflow must run from main."
            exit 1
          fi

          if [[ "$APPROVED" != "true" ]]; then
            echo "::error::Production approval input must be true."
            exit 1
          fi

          if [[ "${DEPLOYMENT_ENABLED:-}" != "true" ]]; then
            echo "::error::PRODUCTION_DEPLOYMENT_ENABLED must equal true."
            exit 1
          fi

          echo "Production gate passed."

  publish-images:
    name: Publish images to Harbor
    runs-on: ubuntu-latest
    needs: [frontend, backend, secret-check, production-preflight]
    if: needs.production-preflight.result == 'success'
    environment: production

    outputs:
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      backend_digest: ${{ steps.backend.outputs.digest }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: public-registry.smolelab.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: public-registry.smolelab.com/og/kotrack-frontend:${{ github.sha }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: public-registry.smolelab.com/og/kotrack-backend:${{ github.sha }}

  migrate-production:
    name: Production database migration
    runs-on: ubuntu-latest
    needs: [backend, publish-images, production-preflight]
    if: needs.production-preflight.result == 'success'
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Connect to Rancher
        env:
          RANCHER_ACCESS_KEY: ${{ secrets.RANCHER_ACCESS_KEY }}
          RANCHER_SECRET_KEY: ${{ secrets.RANCHER_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RANCHER_ACCESS_KEY"
          test -n "$RANCHER_SECRET_KEY"

          kubectl config set-cluster rancher \
            --server=https://rancher.smolelab.com/k8s/clusters/local

          kubectl config set-credentials github-actions \
            --token="${RANCHER_ACCESS_KEY}:${RANCHER_SECRET_KEY}"

          kubectl config set-context kotrack-production \
            --cluster=rancher \
            --user=github-actions \
            --namespace=app

          kubectl config use-context kotrack-production

      - name: Verify backup evidence reference
        env:
          BACKUP_RESTORE_TEST_ID: ${{ inputs.backup_restore_test_id }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_RESTORE_TEST_ID"
          echo "Backup/restore evidence reference: $BACKUP_RESTORE_TEST_ID"
          kubectl auth can-i create jobs -n app | grep -qx yes

      - name: Run guarded migration
        env:
          BACKEND_DIGEST: ${{ needs.publish-images.outputs.backend_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST"

          # Block active or unfinished migration jobs.
          kubectl get jobs -n app -o json | python -c '
          import json, sys

          jobs = [
              j for j in json.load(sys.stdin)["items"]
              if j["metadata"]["name"].startswith("kotrack-migrate-")
          ]

          blocked = []
          for j in jobs:
              status = j.get("status", {})
              conditions = status.get("conditions", [])

              complete = any(
                  c.get("type") == "Complete" and c.get("status") == "True"
                  for c in conditions
              )
              failed = any(
                  c.get("type") == "Failed" and c.get("status") == "True"
                  for c in conditions
              )
              active = status.get("active", 0) or 0

              if active or (not complete and not failed):
                  blocked.append(j["metadata"]["name"])

          if blocked:
              print(
                  "Active or incomplete migration jobs require inspection: "
                  + ", ".join(blocked),
                  file=sys.stderr,
              )
              sys.exit(1)

          print("No active or unfinished migration jobs detected.")
          '

          job="kotrack-migrate-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="public-registry.smolelab.com/og/kotrack-backend@${BACKEND_DIGEST}"

          cat <<EOF | kubectl create -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${job}
            namespace: app
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: harbor-registry
                containers:
                  - name: migrate
                    image: ${image}
                    imagePullPolicy: IfNotPresent
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        python -c 'from sqlalchemy import text; from app.db.session import engine; u=engine.url; assert u.host == "postgresql.database.svc.cluster.local" and u.database == "og", "Unexpected database target"; c=engine.connect(); r=c.execute(text("select version_num from alembic_version")).scalar_one(); assert r in {"d3896ea15b0f","a2190d9f7c31","c840a2b9d13f","d172a0f61c42"}, "Unexpected migration revision"; print("Verified:",u.host,u.database,r); c.close()'
                        python -m alembic upgrade head
                        python -m alembic current
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: kotrack-secrets
                            key: DATABASE_URL
                      - name: JWT_SECRET_KEY
                        valueFrom:
                          secretKeyRef:
                            name: kotrack-secrets
                            key: JWT_SECRET_KEY
          EOF

          if ! kubectl wait --for=condition=complete "job/${job}" \
              -n app --timeout=660s; then
            echo "Migration failed. Collecting diagnostics."
            kubectl describe "job/${job}" -n app || true
            kubectl logs "job/${job}" -n app --all-containers=true || true
            exit 1
          fi

          kubectl logs "job/${job}" -n app

  deploy-production:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [publish-images, migrate-production, production-preflight]
    if: needs.production-preflight.result == 'success'
    environment: production

    steps:
      - uses: azure/setup-kubectl@v4

      - name: Connect to Rancher
        env:
          RANCHER_ACCESS_KEY: ${{ secrets.RANCHER_ACCESS_KEY }}
          RANCHER_SECRET_KEY: ${{ secrets.RANCHER_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RANCHER_ACCESS_KEY"
          test -n "$RANCHER_SECRET_KEY"

          kubectl config set-cluster rancher \
            --server=https://rancher.smolelab.com/k8s/clusters/local

          kubectl config set-credentials github-actions \
            --token="${RANCHER_ACCESS_KEY}:${RANCHER_SECRET_KEY}"

          kubectl config set-context kotrack-production \
            --cluster=rancher \
            --user=github-actions \
            --namespace=app

          kubectl config use-context kotrack-production

      - name: Check existing deployments and permissions
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment kotrack-backend kotrack-frontend -n app
          kubectl auth can-i patch deployments -n app | grep -qx yes

      - name: Save previous images for recovery
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          backend_image="$(kubectl get deployment kotrack-backend -n app \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="kotrack-backend")].image}')"

          frontend_image="$(kubectl get deployment kotrack-frontend -n app \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="kotrack-frontend")].image}')"

          if [[ -z "$backend_image" || -z "$frontend_image" ]]; then
            echo "::error::Could not retrieve both current production image references."
            echo "Backend image: ${backend_image:-EMPTY}"
            echo "Frontend image: ${frontend_image:-EMPTY}"
            exit 1
          fi

          echo "Previous backend image: $backend_image"
          echo "Previous frontend image: $frontend_image"

          echo "backend=$backend_image" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend_image" >> "$GITHUB_OUTPUT"

      - name: Deploy backend
        env:
          DIGEST: ${{ needs.publish-images.outputs.backend_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          kubectl set image deployment/kotrack-backend \
            "kotrack-backend=public-registry.smolelab.com/og/kotrack-backend@${DIGEST}" \
            -n app

          kubectl rollout status deployment/kotrack-backend \
            -n app --timeout=180s

      - name: Deploy frontend
        env:
          DIGEST: ${{ needs.publish-images.outputs.frontend_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DIGEST"

          kubectl set image deployment/kotrack-frontend \
            "kotrack-frontend=public-registry.smolelab.com/og/kotrack-frontend@${DIGEST}" \
            -n app

          kubectl rollout status deployment/kotrack-frontend \
            -n app --timeout=180s

      - name: Health checks
        shell: bash
        run: |
          set -euo pipefail

          kubectl exec deployment/kotrack-backend -n app -- \
            python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=10); assert r.status == 200"

          kubectl exec deployment/kotrack-frontend -n app -c kotrack-frontend -- \
            wget -qO- http://127.0.0.1/ >/dev/null

          kubectl exec deployment/kotrack-frontend -n app -c kotrack-frontend -- \
            wget -qO- http://127.0.0.1/api/health >/dev/null

          kubectl get deployment kotrack-backend kotrack-frontend -n app
          kubectl get pods -n app

      - name: Restore previous application images if deployment fails
        if: ${{ failure() && steps.previous.outputs.backend != '' && steps.previous.outputs.frontend != '' }}
        env:
          BACKEND_IMAGE: ${{ steps.previous.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.previous.outputs.frontend }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Deployment failed. Restoring previous application images."

          kubectl set image deployment/kotrack-backend \
            "kotrack-backend=$BACKEND_IMAGE" -n app

          kubectl set image deployment/kotrack-frontend \
            "kotrack-frontend=$FRONTEND_IMAGE" -n app

          kubectl rollout status deployment/kotrack-backend \
            -n app --timeout=180s

          kubectl rollout status deployment/kotrack-frontend \
            -n app --timeout=180s
