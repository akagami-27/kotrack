apiVersion: apps/v1
kind: Deployment
metadata:
  name: kotrack-backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kotrack-backend
  template:
    metadata:
      labels:
        app: kotrack-backend
    spec:
      imagePullSecrets:
        - name: harbor-registry

      containers:
        - name: backend
          # Template only: replace with the backend digest from the same CI run as
          # the frontend digest before applying. Never deploy a mutable tag.
          image: public-registry.smolelab.com/og/kotrack-backend@sha256:REPLACE_WITH_CI_BACKEND_DIGEST
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kotrack-secrets
                  key: DATABASE_URL

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kotrack-secrets
                  key: JWT_SECRET_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: kotrack-backend
  namespace: app
spec:
  selector:
    app: kotrack-backend

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

  type: ClusterIP
